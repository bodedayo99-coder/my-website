<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - SkyNetics</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Poppins', sans-serif; background:#000; color:#fff; overflow-x:hidden; }

    main.contact {
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      flex-direction:column;
      background: linear-gradient(-45deg, #0a0a0a, #1c1c1c, #0a0a0a, #111);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
    }

    @keyframes gradientBG {
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    h1 {
      font-size:3rem; 
      margin-bottom:25px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
      text-align:center;
    }

    a.back-btn, a.contact-btn {
      display:inline-block; 
      text-decoration:none; 
      color:#fff;
      background: linear-gradient(45deg,#ff6600,#ffcc00);
      padding:15px 30px; 
      border-radius:10px; 
      font-weight:600;
      box-shadow: 0 0 20px #ff6600;
      transition: 0.3s ease all, box-shadow 0.3s ease-in-out;
      margin:10px;
    }

    a.back-btn:hover, a.contact-btn:hover {
      box-shadow: 0 0 35px #ffcc00, 0 0 45px #ff6600;
      transform: translateY(-5px) scale(1.05);
    }

    .contact-info {
      display:flex;
      justify-content:center;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
      font-size:1.2rem;
    }

    .contact-info a { 
      text-decoration:none; 
      color:#fff; 
      display:flex; 
      align-items:center; 
      gap:8px; 
    }

    .contact-form {
      background: rgba(255,255,255,0.05);
      padding:30px 20px;
      border-radius:15px;
      box-shadow:0 0 30px rgba(255,102,0,0.3);
      max-width:500px;
      width:100%;
    }

    .contact-form h2 {
      text-align:center; 
      margin-bottom:20px;
      font-size:2rem; 
      text-shadow:1px 1px 5px rgba(0,0,0,0.6);
    }

    .contact-form input, .contact-form textarea, .contact-form button {
      width:100%;
      padding:12px 15px;
      margin:10px 0;
      border-radius:8px;
      border:none;
      outline:none;
      font-size:1rem;
    }

    .contact-form input, .contact-form textarea {
      background: rgba(255,255,255,0.1); 
      color:#fff;
    }

    .contact-form textarea::placeholder, .contact-form input::placeholder {
      color:#ddd;
    }

    .contact-form button {
      background: linear-gradient(45deg,#ff6600,#ffcc00);
      color:#fff; 
      font-weight:600;
      cursor:pointer;
      box-shadow:0 0 15px #ff6600;
      transition: 0.3s ease all, box-shadow 0.3s ease-in-out;
    }

    .contact-form button:hover {
      box-shadow:0 0 30px #ffcc00, 0 0 35px #ff6600;
      transform: scale(1.03);
    }

    @media(max-width:600px){
      h1 { font-size:2.2rem; }
      .contact-form { padding:20px 15px; }
    }
  </style>
</head>
<body>
  <main class="contact">
    <h1>Contact Us</h1>

    <div class="contact-info">
      <a href="tel:+2349076858627">📞 +234 9076858627</a>
      <a href="https://wa.me/2349076858627" target="_blank">💬 WhatsApp</a>
    </div>

    <div class="contact-form">
      <h2>Send Us a Message</h2>
      <form action="#" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="tel" name="phone" placeholder="Phone Number" required>
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
        <button type="submit" 
        onclick="alert('Thanks For registering')">Submit</button>
      </form>
    </div>

    <a href="index.html" class="back-btn">⬅ Back to Home</a>
  </main>
</body>
</html>
